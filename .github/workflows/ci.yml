name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate application and Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python project
        run: python -m pip install .

      - name: Validate Python syntax
        run: python -m compileall src

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build Lambda package
        run: bash scripts/build_lambda.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Initialize main Terraform
        run: terraform -chdir=infra/terraform init -backend=false

      - name: Validate main Terraform
        run: terraform -chdir=infra/terraform validate

      - name: Initialize bootstrap Terraform
        run: terraform -chdir=infra/bootstrap init -backend=false

      - name: Validate bootstrap Terraform
        run: terraform -chdir=infra/bootstrap validate